{% extends 'base.html' %}{% block title %}Edit Prescription | Nabha TeleCare{% endblock %}{% block content %}<section class="section"><div class="container"><div class="row justify-content-center"><div class="col-lg-8"><div class="card-lift p-4 p-lg-5"><div class="d-flex justify-content-between align-items-start mb-4"><div><div class="eyebrow text-teal">Prescription #{{ prescription.id }}</div><h1 class="h2 mt-2">Edit prescription</h1><p class="text-secondary mb-0">{{ appointment.patient.user.name }} · Patient ID {{ appointment.patient.id }}</p></div><i class="bi bi-file-earmark-medical fs-1 text-success"></i></div><form method="post" class="row g-3"><div class="col-md-6"><label class="form-label">Diagnosis</label><input class="form-control" name="diagnosis" value="{{ prescription.diagnosis }}" required></div><div class="col-md-6"><label class="form-label">Prescribed medicines</label><textarea class="form-control" name="medicines" rows="2" required>{{ prescription.medicines }}</textarea></div><div class="col-md-6"><label class="form-label">Dosage</label><input class="form-control" name="dosage" value="{{ prescription.dosage or '' }}"></div><div class="col-md-6"><label class="form-label">Duration</label><input class="form-control" name="duration" value="{{ prescription.duration or '' }}"></div><div class="col-md-8"><label class="form-label">Instructions</label><textarea class="form-control" name="instructions" rows="3">{{ prescription.instructions }}</textarea></div><div class="col-md-4"><label class="form-label">Follow-up date</label><input class="form-control" type="date" name="follow_up_date" value="{{ prescription.follow_up_date.isoformat() if prescription.follow_up_date else '' }}"></div><div class="col-12 mt-4 d-flex gap-2"><button class="btn btn-primary rounded-pill px-4">Save changes</button><a class="btn btn-soft rounded-pill px-4" href="{{ url_for('prescriptions_page') }}">Cancel</a></div></form></div></div></div></div></section>{% endblock %}

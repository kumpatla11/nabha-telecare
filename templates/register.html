{% extends 'base.html' %}{% block title %}Create Account | Nabha TeleCare{% endblock %}{% block content %}<section class="section login-section"><div class="container"><div class="row justify-content-center"><div class="col-12 col-md-8 col-lg-6"><div class="card-lift p-4 p-lg-5"><div class="text-center mb-4"><div class="brand d-inline-flex align-items-center mb-3"><span class="brand-mark"><i class="bi bi-heart-pulse"></i></span>Nabha TeleCare</div><h1 class="h2 fw-bold mb-2">Create your account</h1><p class="text-secondary mb-0">Start your secure patient journey.</p></div><form method="post" class="row g-3"><div class="col-12"><label class="form-label">Full name</label><input class="form-control" name="name" required></div><div class="col-md-6"><label class="form-label">Email address</label><input class="form-control" type="email" name="email" required></div><div class="col-md-6"><label class="form-label">Mobile number</label><input class="form-control" type="tel" name="phone" required></div><div class="col-md-6"><label class="form-label">Date of birth</label><input class="form-control" type="date" name="date_of_birth" required></div><div class="col-md-6"><label class="form-label">Gender</label><select class="form-select" name="gender" required><option value="">Select</option><option>Female</option><option>Male</option><option>Other</option><option>Prefer not to say</option></select></div><div class="col-md-6"><label class="form-label">Password</label><input class="form-control" type="password" name="password" minlength="8" required></div><div class="col-md-6"><label class="form-label">Confirm password</label><input class="form-control" type="password" name="confirm_password" minlength="8" required></div><div class="col-12 mt-4"><button class="btn btn-primary w-100 py-3 rounded-pill">Create Account</button></div></form><p class="text-center small text-secondary mt-4 mb-0">Already have an account? <a class="text-success fw-semibold" href="{{ url_for('login', role='patient') }}">Sign in</a></p></div></div></div></div></section>{% endblock %}
